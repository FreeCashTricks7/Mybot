<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yono Lucky Draw</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Alfa+Slab+One&family=Impact&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
        
        body { 
            background: #4a0404 linear-gradient(180deg, #5c0606 0%, #2b0202 100%); 
            color: #1e293b; 
            min-height: 100vh; 
            padding-bottom: 95px; 
            position: relative; 
            overflow-x: hidden; 
        }

        .app-container { position: relative; z-index: 1; padding: 16px; max-width: 480px; margin: 0 auto; }

        /* User Header Card */
        .user-header-card { 
            background: #ffffff; 
            border-radius: 22px; 
            padding: 12px 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); 
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar-circle { 
            width: 42px; 
            height: 42px; 
            background: linear-gradient(135deg, #800000, #b30000); 
            color: #fff; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            font-weight: 900; 
        }
        .user-text h3 { font-size: 14px; font-weight: 800; color: #0f172a; }
        .user-text p { font-size: 11px; color: #16a34a; font-weight: 700; }

        .balance-badge { 
            background: linear-gradient(135deg, #16a34a, #15803d); 
            padding: 8px 14px; 
            border-radius: 18px; 
            font-weight: 900; 
            color: #ffffff; 
            font-size: 13px; 
        }

        /* Banner Card Matching Photo 2 Exactly */
        .banner-card { 
            background: linear-gradient(180deg, #012e12 0%, #001f0b 100%); 
            border-radius: 24px; 
            padding: 24px 12px 20px 12px; 
            color: #ffffff; 
            margin-bottom: 16px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.5); 
            text-align: center;
            border: 2px solid #15803d;
            position: relative;
        }

        .banner-graphic-container {
            position: relative;
            width: 100%;
            max-width: 330px;
            height: 230px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stars-top {
            position: absolute;
            top: 2px;
            display: flex;
            gap: 12px;
            z-index: 5;
        }
        .stars-top i {
            color: #facc15;
            font-size: 26px;
            filter: drop-shadow(0 0 8px #facc15);
        }
        .stars-top i:nth-child(2) { font-size: 34px; }

        /* Diamond Frame */
        .diamond-border-frame {
            width: 155px;
            height: 155px;
            background: linear-gradient(135deg, #05401c, #011f0a);
            transform: rotate(45deg);
            border-radius: 20px;
            border: 4px solid #16a34a;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 20px rgba(22, 163, 74, 0.4);
            position: absolute;
            top: 32px;
        }

        /* Structured Overlay Stack */
        .text-overlay-wrapper {
            position: absolute;
            top: 20px;
            width: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEAVY DEEP GOLD YONO - MATCHING LENGTH OF SLOT REEL */
        .huge-3d-yono {
            font-family: 'Impact', 'Alfa Slab One', sans-serif;
            font-size: 76px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 6px; /* Expanded to match slot machine length */
            width: 100%;
            text-align: center;
            background: linear-gradient(180deg, #fffbeb 0%, #facc15 30%, #eab308 65%, #a16207 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Extra Thick Dark Gold Drop-Shadow Extrusions */
            filter: 
                drop-shadow(0px 2px 0px #713f12)
                drop-shadow(0px 4px 0px #532e0d)
                drop-shadow(0px 6px 0px #361e08)
                drop-shadow(0px 8px 0px #1c0f04)
                drop-shadow(0px 12px 16px rgba(0, 0, 0, 0.95));
            margin-bottom: 2px;
            position: relative;
        }

        /* Sparkle flare effect */
        .huge-3d-yono::after {
            content: '✨';
            position: absolute;
            top: 0px;
            right: 25px;
            font-size: 20px;
            -webkit-text-fill-color: #ffffff;
            filter: drop-shadow(0 0 6px #ffffff);
        }

        /* STABLE 3D SLOT MACHINE REEL (LUCKY DRAW) BELOW YONO */
        .slot-machine-reel {
            background: linear-gradient(180deg, #cbd5e1 0%, #ffffff 30%, #ffffff 70%, #94a3b8 100%);
            border: 3px solid #16a34a;
            border-radius: 25px;
            padding: 6px 10px;
            width: 100%;
            box-shadow: 
                inset 0 4px 6px rgba(0,0,0,0.4), 
                inset 0 -4px 6px rgba(0,0,0,0.4),
                0 8px 20px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .slot-cell {
            flex: 1;
            text-align: center;
            border-right: 1.5px solid #cbd5e1;
            padding: 2px 0;
        }
        .slot-cell:last-child { border-right: none; }

        .slot-spade { color: #15803d; font-size: 16px; }

        .slot-letter {
            font-family: 'Impact', 'Alfa Slab One', sans-serif;
            color: #15803d;
            font-size: 19px;
            font-weight: 900;
        }

        .banner-card p { 
            font-size: 12px; 
            color: #fef08a; 
            line-height: 1.5; 
            font-weight: 700;
            margin-top: 10px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        /* Card Elements */
        .card-box { 
            background: #ffffff; 
            border-radius: 22px; 
            padding: 18px; 
            margin-bottom: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); 
        }
        .card-title { font-size: 12px; font-weight: 900; color: #800000; text-transform: uppercase; margin-bottom: 14px; }

        .task-card { 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 16px; 
            padding: 10px 14px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 10px; 
        }
        
        .btn-join { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            color: #ffffff; 
            padding: 8px 18px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 900; 
            border: none; 
            cursor: pointer; 
        }

        .btn-action { 
            width: 100%; 
            background: linear-gradient(135deg, #800000, #b30000); 
            border: none; 
            padding: 16px; 
            border-radius: 20px; 
            font-weight: 900; 
            font-size: 13px; 
            color: #ffffff; 
            cursor: pointer; 
            margin-top: 10px; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- User Header Card -->
        <div class="user-header-card">
            <div class="user-info">
                <div class="avatar-circle">R</div>
                <div class="user-text">
                    <h3>Real Owner 💪</h3>
                    <p>ID: 8189251556</p>
                </div>
            </div>
            <div class="balance-badge">BALANCE: ₹0.00</div>
        </div>

        <!-- Banner Card Matching Photo 2 Exact Proportions -->
        <div class="banner-card">
            <div class="banner-graphic-container">
                <div class="stars-top">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>

                <!-- Diamond Frame -->
                <div class="diamond-border-frame"></div>

                <!-- Stable Text Stack -->
                <div class="text-overlay-wrapper">
                    <!-- Deep Gold Yono extended to match width -->
                    <div class="huge-3d-yono">YONO</div>

                    <!-- Slot Machine Reel for Lucky Draw Placed Perfectly Below -->
                    <div class="slot-machine-reel">
                        <div class="slot-cell"><i class="fa-solid fa-spade slot-spade"></i></div>
                        <div class="slot-cell"><span class="slot-letter">L</span></div>
                        <div class="slot-cell"><span class="slot-letter">U</span></div>
                        <div class="slot-cell"><span class="slot-letter">C</span></div>
                        <div class="slot-cell"><span class="slot-letter">K</span></div>
                        <div class="slot-cell"><span class="slot-letter">Y</span></div>
                        <div class="slot-cell"><span class="slot-letter">D</span></div>
                        <div class="slot-cell"><span class="slot-letter">R</span></div>
                        <div class="slot-cell"><span class="slot-letter">A</span></div>
                        <div class="slot-cell"><span class="slot-letter">W</span></div>
                        <div class="slot-cell"><i class="fa-solid fa-spade slot-spade"></i></div>
                    </div>
                </div>
            </div>

            <p>नीचे दिए गए सभी Telegram Channels को Join करें और अपना ₹100 Winning Prize तुरंत Withdraw करें!</p>
        </div>

        <!-- Tasks Container -->
        <div class="card-box">
            <div class="card-title">LUCKY DRAW CHANNELS (10/10)</div>
            <div class="task-card">
                <span>Channel 1</span>
                <button class="btn-join">JOIN</button>
            </div>
            <div class="task-card">
                <span>Channel 2</span>
                <button class="btn-join">JOIN</button>
            </div>
            <button class="btn-action">VERIFY TASKS & UNLOCK ₹100</button>
        </div>
    </div>

</body>
</html>
