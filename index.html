<!DOCTYPE html>
<html lang="hi">
<head>

    <title>Earn Rewards</title>

    <style>

        .card { background: #1e1e1e; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #0088cc; color: white; border: none; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .btn-submit { background: #28a745; width: 100%; padding: 12px; margin-top: 20px; font-size: 16px; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Task Complete Karein</h2>
    <p>Niche diye gaye sabhi channels ko join karein:</p>

    <div class="card">
        <span>1. Apne Channel Ka Naam</span>
        <a href="https://t.me/Apne_Channel_1_Ka_Link" class="btn" target="_blank">JOIN</a>
    </div>

    <div class="card">
        <span>2. Dusre Channel Ka Naam</span>
        <a href="https://t.me/Apne_Channel_2_Ka_Link" class="btn" target="_blank">JOIN</a>
    </div>

    <button class="btn-submit" onclick="verifyTasks()">CONTINUE / VERIFY</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function verifyTasks() {
            alert("Checking channels... Please wait!");
        }
